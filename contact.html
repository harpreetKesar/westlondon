<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | West London Electrical Services</title>
  <meta name="description" content="Contact West London Electrical Services for electrical repairs, installations, emergency callouts and landlord certificates.">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body data-page="contact">
  <div data-site-header></div>

  <main>
    <section class="page-title dark">
      <p class="eyebrow">Contact</p>
      <h1>Get in touch</h1>
      <p>Call, email or send the enquiry form with a few details about the electrical work you need.</p>
    </section>

    <section class="section contact-grid">
      <div class="contact-card">
        <h2>Contact details</h2>
        <p><strong>Phone:</strong> <a href="tel:07355573777">073 5557 3777</a></p>
        <p><strong>Email:</strong> <a href="mailto:info@westlondonelectricalservices.co.uk">info@westlondonelectricalservices.co.uk</a></p>
        <p><strong>Address:</strong><br>7 Nursery Gardens<br>Hounslow<br>London TW4 5EY</p>
      </div>

      <form class="contact-form" action="mailto:info@westlondonelectricalservices.co.uk" method="post" enctype="text/plain">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="message">Job details</label>
        <textarea id="message" name="message" rows="7" placeholder="Tell us what you need help with"></textarea>
        <button class="button primary" type="submit">Send enquiry</button>
      </form>
    </section>
  </main>

  <div data-site-footer></div>
</body>
</html>
